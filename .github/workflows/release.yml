name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Check the tag matches the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: python -c "import os, sys; from gesture_control import __version__ as v; sys.exit(0 if os.environ['TAG'] == f'v{v}' else f'Tag does not match version {v}')"
      - run: python scripts/download_model.py
      - run: python -m pytest
      - run: python scripts/build_exe.py --package
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/HandGestureControl-*.zip --title "$TAG" --generate-notes --verify-tag
